D.en={title:"Privacy Policy", eff:"Effective date: ______________________", app:"VIPHola.com",

 {h:"", b:["Booman Inc. (\"the Company\") respects your privacy and complies with the Personal Information Protection Act and other applicable laws of the Republic of Korea. This policy applies to \"VIPHola.com\" (https://viphola.com, \"the Service\"), the private VIP travel service operated by the Company."]},
 {h:"1. Information we collect and how", b:[

   "Collection method: entered directly by you in the request form and traveller details fields on the Service, or sent by you by email or messenger."]},
 {h:"2. Purpose of collection and use", b:[

    "To book and run your itinerary, including hotels, restaurants, cars, airport assistance and experiences",

    "To contact you during your journey and respond to emergencies (24/7 concierge)",
    "To prevent fraudulent use and abuse of the request form"]]},
 {h:"3. Retention and use period", b:[
   "The Company destroys personal information without delay once the purpose of its collection and use has been achieved.",

 {h:"4. Provision to third parties", b:[

 {h:"", b:["株式会社 富滿（Booman Inc.、以下「当社」）は、韓国の「個人情報保護法」等の関連法令を遵守し、お客様の個人情報を大切に保護します。本方針は、当社が運営するプライベートVIP旅行サービス「VIPHola.com」（https://viphola.com、以下「本サービス」）に適用されます。"]},
 {h:"1. 収集する個人情報の項目および方法", b:[
   "当社は、旅行のご相談とご予約に必要な情報のみを収集します。",
   ["旅行のお申し込み時 — 氏名、メールアドレス、電話番号（またはWhatsApp番号）、ご案内メールの言語、旅行日程と人数、到着・出発空港と航空便・時刻、お選びいただいた日程とお好み（ブランド・ワインなど）、特別なご要望（食事制限・記念日など、お客様ご自身がご記入された内容）",
    "お支払い後のご旅行者情報 — ご旅行者ごとのパスポート記載の氏名、国籍、生年月日、パスポート番号、パスポート有効期限（専用車と空港アシストの手配のため）",
    "お支払い時 — お支払い金額、決済状況、注文番号。カード番号などの決済手段の情報は決済代行会社（PortOne・KGイニシス）が処理し、当社は保存しません。",
    "ご相談中 — メール・メッセンジャー（WhatsApp・LINE・WeChat）でお客様からお送りいただいた内容",
    "自動収集 — お申し込みの濫用防止と訪問者数の集計のための、IPアドレスを一方向暗号化した値（元のIPアドレスは保存しません）"],
   "収集方法：本サービス画面のお申し込みフォームとご旅行者情報の欄にお客様が直接ご入力いただくか、メール・メッセンジャーでお客様からお送りいただいた内容を通じて収集します。"]},
 {h:"2. 収集・利用の目的", b:[
   ["旅行のご相談、お見積りの作成とご案内メールの送信",
    "ホテル・レストラン・専用車・空港アシスト・体験など、旅行日程の予約と実施",
    "お支払いの確認と返金の処理",
    "旅行中のご連絡と緊急時の対応（24時間コンシェルジュ）",
    "不正利用とお申し込みの濫用の防止"]]},
 {h:"3. 保有および利用期間", b:[
   "当社は、収集・利用の目的を達成した後は、個人情報を遅滞なく破棄します。",
   ["パスポート情報：旅程終了の15日後に削除します。",
    "旅行のご相談・ご予約の情報：ご相談とご旅行が終了し、目的を達成した後に削除します。ただし、以下のとおり関係法令により保管が義務付けられている情報は、その期間保管します。",
    "契約または申込みの撤回等に関する記録：5年（「電子商取引等における消費者保護に関する法律」）",
    "代金決済および財貨等の供給に関する記録：5年（同法）",
    "消費者の苦情または紛争処理に関する記録：3年（同法）",
    "お申し込みの濫用防止用の暗号化値：短期間のみ使用し、削除します。"],
   "お客様から削除のご依頼があった場合は、法令により保管が必要な情報を除き、遅滞なく破棄します。"]},
 {h:"4. 個人情報の第三者提供", b:[
   "当社はお客様の個人情報を販売しません。ご旅行の予約のため、以下のとおり必要な範囲でのみ提供します。",
   ["提供先：お客様のお見積りに含まれるホテル・レストラン・ハイヤー会社・空港アシスト会社・体験・公演・観覧施設",
    "提供目的：予約および旅行サービスの提供",
    "提供項目：予約者氏名、人数、日程と時刻、航空便、食事制限などのご要望。空港アシスト会社・ハイヤー会社には、アシスト・保安手続きに必要な場合、パスポート記載の氏名・国籍・生年月日・パスポート番号",
    "保有期間：各提携先が予約を履行するために必要な期間"],
   "提供先はお客様の日程によって異なり、お見積りに含まれる提携先にのみ提供します。",
   "そのほか、法令に根拠がある場合や捜査機関の適法な要請がある場合を除き、第三者には提供しません。"]},
 {h:"5. 個人情報の処理委託および国外移転", b:[
   "当社は、本サービスの運営のため、以下の事業者に個人情報の処理を委託しています。",
   ["Cloudflare（米国）：サービスのサーバー運営とデータの保管 — 上記のデータ（パスポート情報などは暗号化して保管）",
    "Resend（米国）：お見積り・ご案内メールの送信 — お客様のメールアドレスとメール内容",
    "Telegram：新しいお申し込みなどを当社担当者に通知 — お申し込みの概要",
    "PortOne・KGイニシス：カード決済の処理 — お支払い金額、注文番号と決済に必要な情報",
    "WhatsApp（Meta）・LINE（LINEヤフー株式会社）・WeChat（Tencent）：お客様がメッセンジャーでご連絡される場合 — やり取りしたメッセージ（各メッセンジャー運営会社の方針に従って処理）"],
   "上記の海外サービスを利用する過程で、一部の情報が韓国国外（海外サーバー）へ転送される場合があります。これはサービス提供に必要な範囲に限られます。"]},
 {h:"6. お客様の権利", b:[
   "お客様はいつでもご自身の個人情報の閲覧・訂正・削除を求め、同意を撤回できます。",
   "ご請求はカスタマーセンター（+82-10-4221-7066）またはメール（concierge@viphola.com）で行え、当社は遅滞なく対応します。"]},
 {h:"7. 安全性確保の措置", b:[
   "当社は、パスポート情報などの重要な個人情報を暗号化して保管し、担当コンシェルジュのみが閲覧できるようアクセス権限を制限します。"]},
 {h:"8. 個人情報保護責任者", b:[
   "個人情報の取り扱いに関する問い合わせ・苦情・救済は、下記の保護責任者にご連絡ください。",
   ["個人情報保護責任者：黄義晩（Hwang Euiman）",
    "カスタマーセンター：+82-10-4221-7066",
    "メール：concierge@viphola.com"]]},
 {h:"9. 児童の個人情報", b:[
   "満14歳未満のお子様がご一緒に旅行される場合、お子様のご旅行者情報は、保護者が同意のうえ直接ご入力いただきます。"]},
 {h:"10. 方針の変更", b:[
   "本方針が変更される場合、施行日および変更内容を本ページで告知します。"]},
 {h:"言語", b:["本方針は韓国語で作成されています。他の言語の翻訳と内容が異なる場合は、韓国語版が優先します。"]}
 ]};

D.zhs={title:"隐私政策", eff:"施行日期：______________________", app:"VIPHola.com",

    "咨询过程中 — 客户通过电子邮件或即时通讯工具（WhatsApp、LINE、微信）发送的内容",
    "自动收集 — 为防止滥用申请和统计访客数量，对IP地址进行单向加密后的值（不保存原始IP地址）"],
   "收集方式：由客户在本服务页面的申请表和旅客信息栏中直接填写，或通过客户以电子邮件、即时通讯工具发送的内容收集。"]},
 {h:"2. 收集与使用目的", b:[
   ["旅行咨询、制作报价单及发送通知邮件",

 {h:"4. 向第三方提供个人信息", b:[

    "保存期限：各合作商家履行预订所需的期限"],

 {h:"5. 个人信息处理委托及跨境转移", b:[

 {h:"9. 儿童个人信息", b:[

 {h:"10. 政策变更", b:[

function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
/* escape the text, then turn the contact email into a mail link */
function inline(s){ return esc(s).replace(/concierge@viphola\.com/g,'<a href="mailto:concierge@viphola.com">concierge@viphola.com</a>'); }

function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:concierge@viphola.com">concierge@viphola.com</a>'],
  [o.ad, o.adv]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}

function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="https://viphola.com/?lang="+lang;
  document.title=d.title+" · "+(d.app||"VIPHola.com");
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}

function pick(){ var r=pick0(); return LANG_ON.indexOf(r)>=0?r:"en"; }   // 숨긴 언어는 영어로 (11-13)
function pick0(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}

(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANG_ON.length;i++) h+='<button data-l="'+LANG_ON[i]+'">'+LBL[LANG_ON[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>

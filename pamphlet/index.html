<script>
  (function () {
    'use strict';
    var L0 = window.VIP_LANG, c = document.querySelector('[data-pam-cta]'), b = document.getElementById('pam-open');
    // 아래 단추: 한국어는 대문(한국어 있음), 다른 언어는 서울 화면 신청 칸으로
    if (c) c.setAttribute('href', L0 === 'ko' ? '../?lang=ko' : '../seoul/?lang=' + L0 + '#request');
    // 언어를 바꾸면 그 언어로 처음부터 다시 펼친다
    document.addEventListener('vip:lang', function (e) {
      var l = e.detail; if (!l || l === L0) return;
      try { location.replace(location.pathname + '?lang=' + l); } catch (x) { location.href = '?lang=' + l; }
    });
    // 열자마자 펼침
    if (b) setTimeout(function () { b.click(); }, 80);
  })();
</script>
